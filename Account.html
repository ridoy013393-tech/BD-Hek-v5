  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDgbrf0Px_xYykZwLYgjYWD_AeKgV8CwKI",
      authDomain: "emergency-services-bc51e.firebaseapp.com",
      projectId: "emergency-services-bc51e",
      storageBucket: "emergency-services-bc51e.firebasestorage.app",
      messagingSenderId: "984254477080",
      appId: "1:984254477080:web:5515ed51d48bd28015246d"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // অফলাইন পারসিস্টেন্স বা লোকাল ক্যাশিং চালু করা
    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      console.warn("Firestore offline persistence status: ", err.code);
    });

    const triggerFeedback = (type, settings) => {
      if (settings.vibration && navigator.vibrate) {
        if (type === 'success') navigator.vibrate([100, 50, 100]);
        else if (type === 'warning') navigator.vibrate([200]);
        else navigator.vibrate([50]);
      }
      if (settings.sound) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator(); const gainNode = ctx.createGain();
          osc.connect(gainNode); gainNode.connect(ctx.destination);
          osc.type = type === 'warning' ? 'square' : 'sine';
          osc.frequency.setValueAtTime(type === 'success' ? 400 : (type === 'warning' ? 200 : 600), ctx.currentTime);
          if (type === 'success') osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
          gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (type==='click'?0.05:0.2));
          osc.start(); osc.stop(ctx.currentTime + (type==='click'?0.05:0.2));
        } catch (e) {}
      }
    };

    const t = {

        backupSuccess: 'Data successfully backed up to cloud!', restoreSuccess: 'Data restored successfully!', enterCode: 'Please enter a Sync Key'
      },
      bn: {
        dashboard: 'ড্যাশবোর্ড', transactions: 'লেনদেন', reports: 'এআই রিপোর্ট', 
        budget: 'বাজেট ও ওয়ালেট', savings: 'সঞ্চয়', calendar: 'ক্যালেন্ডার', 
        calculator: 'ক্যালকুলেটর', settings: 'সেটিংস', about: 'অ্যাপ সম্পর্কে',
        balance: 'ক্যাশ ব্যালেন্স', income: 'মোট আয়', expense: 'মোট খরচ',
        quickActions: 'কুইক অ্যাকশন', recent: 'সাম্প্রতিক লেনদেন',
        addRecord: 'নতুন হিসাব', amount: 'টাকার পরিমাণ', category: 'ক্যাটাগরি', save: 'সেভ করুন',
        aiTitle: 'এআই আর্থিক বিশ্লেষণ', health: 'আর্থিক স্বাস্থ্য', avgDaily: 'দৈনিক গড় খরচ',
        biggestExp: 'সবচেয়ে বড় খরচ', biggestInc: 'সবচেয়ে বড় আয়', whereSpend: 'যেখানে বেশি খরচ করেছেন',
        aiTip: 'এআই পরামর্শ', noRecords: 'কোনো হিসাব নেই।', guest: 'গেস্ট / অফলাইন',
        loginTip: 'সেটিংস থেকে ব্যাকআপ কোড দিন', lockApp: 'অ্যাপ লক করুন', logout: 'লগআউট',
        darkMode: 'ডার্ক মোড', language: 'ভাষা (Language)', currency: 'মুদ্রা', theme: 'থিম কালার',
        sound: 'সাউন্ড ইফেক্ট', vibration: 'ভাইব্রেশন', appLock: 'অ্যাপ লক (PIN)',
        export: 'ডাটা এক্সপোর্ট', reset: 'সব ডাটা মুছুন', enterPin: 'পিন দিন', setPin: 'নতুন পিন সেট করুন',
        dev: 'ডেভেলপার', version: 'ভার্সন',
        catFood: 'খাবার', catTransport: 'যাতায়াত', catShop: 'শপিং', catBill: 'বিল', catHealth: 'স্বাস্থ্য', catOther: 'অন্যান্য',
        catSalary: 'বেতন', catFree: 'ফ্রিল্যান্স', catInv: 'বিনিয়োগ', catGift: 'উপহার',
        qaTransfer: 'ট্রান্সফার', qaRequest: 'রিকোয়েস্ট', qaTopUp: 'টপ আপ', qaBills: 'পেমেন্ট',
        budgetLimit: 'মাসিক বাজেট লিমিট', setBudget: 'বাজেট সেট করুন', totalSpent: 'মোট খরচ হয়েছে',
        savingsGoal: 'সঞ্চয়ের লক্ষ্য', addSavings: 'সঞ্চয় জমা করুন', target: 'লক্ষ্য', clear: 'মুছুন', result: 'ফলাফল',
        desc: 'বিবরণ / নাম', folderView: 'ফোল্ডার ভিউ', allTx: 'সব লেনদেন',
        backupTitle: 'ক্লাউড ব্যাকআপ ও সিঙ্ক', backupCode: 'গোপন সিঙ্ক কী (Secret Sync Key)', backupBtn: 'ব্যাকআপ আপডেট করুন', restoreBtn: 'তথ্য ফিরিয়ে আনুন',
        backupSuccess: 'সফলভাবে ক্লাউডে ব্যাকআপ আপডেট করা হয়েছে!', restoreSuccess: 'আপনার আগের সমস্ত তথ্য ফিরে এসেছে!', enterCode: 'অনুগ্রহ করে একটি সিঙ্ক কী দিন'
      }
    };

    function App() {
      const [splash, setSplash] = useState(true);
      const [locked, setLocked] = useState(true);
      const [pin, setPin] = useState('');
      const [setupPin, setSetupPin] = useState(false);
      const [currentRoute, setCurrentRoute] = useState('dashboard');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('finai_txs_v6')) || []);
      const [extraData, setExtraData] = useState(() => JSON.parse(localStorage.getItem('finai_extra_v6')) || { budget: 0, savings: 0, target: 0 });
      const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('finai_settings_v6')) || { 
          darkMode: true, lang: 'bn', currency: '৳', sound: true, vibration: true, appLock: false, pinCode: '', animations: true, themeColor: 'indigo', fontSize: 'text-base' 
      });
      const [syncCode, setSyncCode] = useState(() => localStorage.getItem('finai_synccode_v6') || '');
      const [lastBackup, setLastBackup] = useState(() => localStorage.getItem('finai_last_backup_v6') || '');

      useEffect(() => { localStorage.setItem('finai_settings_v6', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('finai_extra_v6', JSON.stringify(extraData)); }, [extraData]);
      useEffect(() => { localStorage.setItem('finai_synccode_v6', syncCode); }, [syncCode]);
      useEffect(() => { localStorage.setItem('finai_last_backup_v6', lastBackup); }, [lastBackup]);
      useEffect(() => { setTimeout(() => setSplash(false), 2000); }, []);

      // ইন্টারনেট সংযোগ পর্যবেক্ষণ
      useEffect(() => {
        const handleOnline = () => {
          setIsOnline(true);
          showToast(settings.lang === 'bn' ? 'ইন্টারনেট কানেক্ট হয়েছে!' : 'Back online!', 'success');
        };
        const handleOffline = () => {
          setIsOnline(false);
          showToast(settings.lang === 'bn' ? 'ইন্টারনেট কানেকশন হারিয়ে গেছে!' : 'Connection lost!', 'error');
        };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, [settings.lang]);

      // অফলাইনে কাজ শেষ করে পুনরায় অনলাইনে আসলে স্বয়ংক্রিয় সিঙ্ক চালু করা
      useEffect(() => {
        if (isOnline && syncCode && transactions.length > 0) {
          const cleanCode = syncCode.trim().toLowerCase();
          const payload = { transactions, extraData, settings, updatedAt: new Date().toISOString() };
          const timeNow = new Date().toLocaleString();

          db.collection('backups').doc(cleanCode).set(payload)
            .then(() => {
              setLastBackup(timeNow);
              localStorage.setItem('finai_last_backup_v6', timeNow);
              showToast(settings.lang === 'bn' ? 'অফলাইন ডেটা ক্লাউডে সিঙ্ক হয়েছে!' : 'Offline data successfully synced to cloud!', 'success');
            })
            .catch(err => {
              console.warn("Auto-sync to Firestore failed, attempting Failsafe...", err);
              fetch(`https://kvdb.io/uR9v8WjL4m6P3qN7yZ5X/finai_backup_${cleanCode}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
              })
              .then(res => {
                if (res.ok) {
                  setLastBackup(timeNow);
                  localStorage.setItem('finai_last_backup_v6', timeNow);
                }
              })
              .catch(e => console.error("Failsafe auto-sync failed:", e));
            });
        }
      }, [isOnline]);

      const lang = t[settings.lang];
      const showToast = (message, type = 'info') => {
        triggerFeedback(type === 'error' ? 'warning' : 'success', settings);
        setToast({ message, type }); setTimeout(() => setToast(null), 4000);
      };
      const navTo = (route) => { triggerFeedback('click', settings); setCurrentRoute(route); setSidebarOpen(false); };

      const generateRandomKey = () => {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 8; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return `fin_${result}`;
      };

      const applyRestoredData = (data, cleanCode) => {
        if (data.transactions) {
          setTransactions(data.transactions);
          localStorage.setItem('finai_txs_v6', JSON.stringify(data.transactions));
        }
        if (data.extraData) {
          setExtraData(data.extraData);
          localStorage.setItem('finai_extra_v6', JSON.stringify(data.extraData));
        }
        if (data.settings) {
          setSettings(data.settings);
          localStorage.setItem('finai_settings_v6', JSON.stringify(data.settings));
        }
        setSyncCode(cleanCode);
        const timeNow = new Date().toLocaleString();
        setLastBackup(timeNow);
        showToast(lang.restoreSuccess, 'success');
        alert(settings.lang === 'bn' ? "তথ্য সফলভাবে ক্লাউড থেকে ফিরিয়ে আনা হয়েছে!" : "Data restored successfully!");
      };

      const handleCloudBackupNew = async () => {
        if (!isOnline) {
          showToast(settings.lang === 'bn' ? 'অফলাইনে ব্যাকআপ কোড তৈরি করা সম্ভব নয়!' : 'Cannot generate backup key while offline!', 'error');
          return;
        }
        triggerFeedback('click', settings);
        try {
          showToast(settings.lang === 'bn' ? 'ব্যাকআপ তৈরি হচ্ছে...' : 'Creating backup...', 'info');
          const newKey = generateRandomKey();
          const payload = { transactions, extraData, settings, updatedAt: new Date().toISOString() };

          let saved = false;
          try {
            await db.collection('backups').doc(newKey).set(payload);
            saved = true;
          } catch (e) {
            console.warn("Firestore new-key error, using failsafe...", e);
          }

          if (!saved) {
            const res = await fetch(`https://kvdb.io/uR9v8WjL4m6P3qN7yZ5X/finai_backup_${newKey}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error("Failsafe server rejected write");
          }

          setSyncCode(newKey);
          const timeNow = new Date().toLocaleString();
          setLastBackup(timeNow);
          showToast(settings.lang === 'bn' ? 'নতুন ব্যাকআপ তৈরি হয়েছে! কোডটি কপি করে রাখুন।' : 'New backup created! Please copy the key.', 'success');
          alert(settings.lang === 'bn' 
            ? `নতুন ব্যাকআপ কোড তৈরি হয়েছে!\n\nআপনার গোপন কোড: ${newKey.toUpperCase()}\n\nপরবর্তীতে ডেটা পুনরুদ্ধারের জন্য এটি লিখে বা কপি করে রাখুন!` 
            : `New Backup Key Generated!\n\nYour Secret Key: ${newKey.toUpperCase()}\n\nPlease copy and keep it safe!`
          );
        } catch (e) {
          console.error(e);
          showToast('Backup failed: ' + e.message, 'error');
          alert('Backup failed: ' + e.message);
        }
      };

      const handleCloudBackupUpdate = async (code) => {
        if (!code.trim()) {
          showToast(lang.enterCode, 'error');
          return;
        }
        if (!isOnline) {
          showToast(settings.lang === 'bn' ? 'অফলাইন! এই মুহূর্তে ক্লাউড ডাটা আপডেট করা সম্ভব নয়।' : 'Offline! Cannot upload backup currently.', 'error');
          return;
        }
        triggerFeedback('click', settings);
        const cleanCode = code.trim().toLowerCase();
        const payload = { transactions, extraData, settings, updatedAt: new Date().toISOString() };

        showToast(settings.lang === 'bn' ? 'ব্যাকআপ আপডেট হচ্ছে...' : 'Updating backup...', 'info');

        let saved = false;
        try {
          await db.collection('backups').doc(cleanCode).set(payload);
          saved = true;
          setSyncCode(cleanCode);
          const timeNow = new Date().toLocaleString();
          setLastBackup(timeNow);
          showToast(lang.backupSuccess, 'success');
          alert(settings.lang === 'bn' ? "আপনার ডাটা সফলভাবে ক্লাউডে ব্যাকআপ নেওয়া হয়েছে!" : "Data successfully backed up to cloud!");
          return;
        } catch (e) {
          console.warn("Firestore update error, using failsafe...", e);
        }

        try {
          const res = await fetch(`https://kvdb.io/uR9v8WjL4m6P3qN7yZ5X/finai_backup_${cleanCode}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            setSyncCode(cleanCode);
            const timeNow = new Date().toLocaleString();
            setLastBackup(timeNow);
            showToast(lang.backupSuccess, 'success');
            alert(settings.lang === 'bn' ? "আপনার ডাটা সফলভাবে ক্লাউডে ব্যাকআপ নেওয়া হয়েছে!" : "Data successfully backed up to cloud!");
          } else {
            showToast('Update failed: Server rejected write', 'error');
            alert('Update failed: Server rejected write');
          }
        } catch (e) {
          console.error(e);
          showToast('Update failed: ' + e.message, 'error');
          alert('Update failed: ' + e.message);
        }
      };

      const handleCloudRestore = async (code) => {
        if (!code.trim()) {
          showToast(lang.enterCode, 'error');
          return;
        }
        if (!isOnline) {
          showToast(settings.lang === 'bn' ? 'ডাটা রিস্টোর করার জন্য ইন্টারনেট সংযোগ আবশ্যক!' : 'Internet connection is required to restore data!', 'error');
          return;
        }
        triggerFeedback('click', settings);
        const cleanCode = code.trim().toLowerCase();

        showToast(settings.lang === 'bn' ? 'তথ্য খোঁজা হচ্ছে...' : 'Fetching data...', 'info');

        try {
          const doc = await db.collection('backups').doc(cleanCode).get();
          if (doc.exists) {
            applyRestoredData(doc.data(), cleanCode);
            return;
          }
        } catch (e) {
          console.warn("Firestore fetch error, checking failsafe server...", e);
        }

        try {
          const res = await fetch(`https://kvdb.io/uR9v8WjL4m6P3qN7yZ5X/finai_backup_${cleanCode}`);
          if (res.ok) {
            const data = await res.json();
            applyRestoredData(data, cleanCode);
          } else {
            showToast(settings.lang === 'bn' ? 'ভুল কোড! কোনো ব্যাকআপ পাওয়া যায়নি।', 'error');
            alert(settings.lang === 'bn' ? 'ভুল কোড! কোনো ব্যাকআপ পাওয়া যায়নি।' : 'Invalid Code! No backup found.');
          }
        } catch (e) {
          console.error(e);
          showToast('Restore failed: ' + e.message, 'error');
          alert('Restore failed: ' + e.message);
        }
      };

      const themeClass = settings.darkMode ? 'bg-slate-950 text-white' : 'bg-slate-50 text-slate-900';
      const glassClass = settings.darkMode ? 'bg-white/10 backdrop-blur-lg border border-white/10' : 'bg-white/70 backdrop-blur-lg border border-slate-200 shadow-xl';
      const textMuted = settings.darkMode ? 'text-slate-400' : 'text-slate-500';

          <h2 className="text-2xl font-bold mb-8">{setupPin ? lang.setPin : lang.enterPin}</h2>
          <div className="flex gap-4 mb-12">

                if (key === 'C') setPin('');

                  if (setupPin && pin.length === 4) { setSettings(s => ({...s, appLock: true, pinCode: pin})); setSetupPin(false); setPin(''); showToast('PIN Set', 'success'); }
                  else if (!setupPin && pin === settings.pinCode) { triggerFeedback('success', settings); setLocked(false); setPin(''); } 
                  else { showToast('Error', 'error'); setPin(''); }
                } else if (pin.length < 4) setPin(p => p + key);

      const sidebarItems = [

        { id: 'budget', icon: 'fa-wallet', label: lang.budget },

                  </div>

            {currentRoute === 'budget' && <BudgetPage lang={lang} transactions={transactions} extra={extraData} setExtra={setExtraData} settings={settings} glassClass={glassClass} textMuted={textMuted} pc={primaryColorClass} pbg={primaryBgClass} tf={triggerFeedback}/>}
            {currentRoute === 'savings' && <SavingsPage lang={lang} extra={extraData} setExtra={setExtraData} settings={settings} glassClass={glassClass} textMuted={textMuted} pc={primaryColorClass} pbg={primaryBgClass} tf={triggerFeedback}/>}

              <button key={item.id} onClick={() => navTo(item.id)} className={`flex flex-col items-center transition-all ${currentRoute === item.id ? `${primaryColorClass} scale-110 drop-shadow-md` : 'opacity-50'}`}><i className={`fas ${item.icon} text-2xl`}></i></button>
            ))}
          </nav>

          {currentRoute === 'add-transaction' && <AddTransactionModal lang={lang} onClose={() => navTo('dashboard')} onSave={(tx)=>{
              const newTxs = [tx, ...transactions]; 
              setTransactions(newTxs); 
              localStorage.setItem('finai_txs_v6', JSON.stringify(newTxs));
              
              showToast(settings.lang === 'bn' ? 'সফলভাবে সেভ হয়েছে!' : 'Saved successfully', 'success'); 
              navTo('dashboard');

              if (syncCode) {
                // ইন্টারনেট অফ থাকলে ক্লাউড আপডেট এড়িয়ে যাবে এবং ইন্টারনেট আসার পরে অটো সিঙ্ক হবে
                if (!navigator.onLine) {
                  showToast(settings.lang === 'bn' ? 'অফলাইন! ইন্টারনেট কানেক্ট হলে ক্লাউডে সিঙ্ক হবে।' : 'Offline! Will sync when online.', 'info');
                  return;
                }

                const cleanCode = syncCode.trim().toLowerCase();
                const payload = { transactions: newTxs, extraData, settings, updatedAt: new Date().toISOString() };
                const timeNow = new Date().toLocaleString();

                db.collection('backups').doc(cleanCode).set(payload)
                .then(() => {
                  setLastBackup(timeNow);
                  localStorage.setItem('finai_last_backup_v6', timeNow);
                })
                .catch(err => {
                  console.warn("Auto-sync to Firestore failed, attempting Failsafe...", err);
                  fetch(`https://kvdb.io/uR9v8WjL4m6P3qN7yZ5X/finai_backup_${cleanCode}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                  })
                  .then(res => {
                    if (res.ok) {
                      setLastBackup(timeNow);
                      localStorage.setItem('finai_last_backup_v6', timeNow);
                    }
                  })
                  .catch(e => console.error("Failsafe auto-sync failed:", e));
                });
              }
          }} settings={settings} glassClass={glassClass} textMuted={textMuted} pbg={primaryBgClass} tf={triggerFeedback}/>}

          {toast && (
            <div className={`fixed top-24 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full flex items-center gap-3 shadow-2xl transition-all duration-300 ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500'} text-white`}>
              <i className={`fas ${toast.type === 'error' ? 'fa-triangle-exclamation' : 'fa-check-circle'}`}></i> <span className="font-medium text-sm">{toast.message}</span>
            </div>
          )}
        </div>
      );

    // --- Components ---

      return (
        <div className={`space-y-6 ${settings.animations ? 'animate-fade-in-up' : ''}`}>

            <div className={`absolute -right-10 -top-10 w-32 h-32 ${pbg} opacity-20 rounded-full blur-2xl`}></div>
            <p className={`text-sm font-bold uppercase tracking-wider ${pc} mb-1`}><i className="fas fa-wallet"></i> {lang.balance}</p>

            <div className="flex justify-between items-center gap-4 bg-black/10 p-4 rounded-2xl">

                <div><p className={`text-xs ${textMuted}`}>{lang.income}</p><p className="font-bold text-emerald-500">{settings.currency}{stats.income.toLocaleString()}</p></div>
              </div>
              <div className="w-px h-8 bg-white/10"></div>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center"><i className="fas fa-arrow-trend-down"></i></div>
                <div><p className={`text-xs ${textMuted}`}>{lang.expense}</p><p className="font-bold text-rose-500">{settings.currency}{stats.expense.toLocaleString()}</p></div>
              </div>
            </div>
          </div>
          <div>
            <h3 className="text-sm font-bold uppercase mb-3 opacity-70 flex items-center gap-2"><i className={`fas fa-bolt ${pc}`}></i> {lang.quickActions}</h3>
            <div className="grid grid-cols-4 gap-3 text-center">
               {[lang.qaTransfer, lang.qaRequest, lang.qaTopUp, lang.qaBills].map((lbl, i) => (
                 <div key={lbl} className={`p-3 rounded-2xl ${glassClass} flex flex-col items-center justify-center gap-2 opacity-70`}>
                   <i className={`fas ${['fa-paper-plane','fa-hand-holding-dollar','fa-credit-card','fa-file-invoice'][i]} text-lg`}></i>
                   <span className="text-[10px] font-bold truncate w-full">{lbl}</span>
                 </div>
               ))}
            </div>
          </div>
          <div>
            <h3 className="text-sm font-bold uppercase mb-3 opacity-70">{lang.recent}</h3>
            <div className="space-y-3">
              {transactions.slice(0, 4).map(tx => (
                <div key={tx.id} className={`p-4 rounded-2xl ${glassClass} flex justify-between items-center`}>
                  <div className="flex items-center gap-4">
                    <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tx.type === 'income' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'}`}><i className={`fas ${tx.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'}`}></i></div>
                    <div>
                      <p className="font-bold text-sm">{tx.description || tx.category}</p>
                      <p className={`text-[10px] ${textMuted}`}>{tx.category} • {new Date(tx.date).toLocaleDateString()}</p>
                    </div>
                  </div>
                  <p className={`font-bold ${tx.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}`}>{tx.type === 'income' ? '+' : '-'}{settings.currency}{tx.amount}</p>

              {transactions.length === 0 && <p className="text-center opacity-50 py-4">{lang.noRecords}</p>}

    function BudgetPage({ lang, transactions, extra, setExtra, settings, glassClass, textMuted, pc, pbg, tf }) {
      const [input, setInput] = useState('');
      const spent = useMemo(() => transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + Number(curr.amount), 0), [transactions]);
      const percentage = extra.budget > 0 ? Math.min(100, (spent / extra.budget) * 100) : 0;
      
      return (
        <div className={`space-y-6 pb-20 ${settings.animations ? 'animate-fade-in-up' : ''}`}>
           <div className={`p-6 rounded-3xl ${glassClass} text-center`}>
              <i className={`fas fa-wallet text-4xl mb-4 ${pc}`}></i>
              <h3 className={`text-sm ${textMuted} mb-1`}>{lang.budgetLimit}</h3>
              <h2 className="text-3xl font-bold">{settings.currency}{extra.budget.toLocaleString()}</h2>
              
              <div className="mt-6 text-left">
                <div className="flex justify-between text-sm mb-2"><span className="font-medium">{lang.totalSpent}</span><span className={percentage >= 90 ? 'text-rose-500 font-bold' : ''}>{settings.currency}{spent.toLocaleString()}</span></div>
                <div className="w-full bg-black/20 rounded-full h-3">
                  <div className={`h-3 rounded-full ${percentage >= 90 ? 'bg-rose-500' : pbg}`} style={{width: `${percentage}%`}}></div>
                </div>
              </div>
           </div>
           
           <div className={`p-4 rounded-2xl ${glassClass}`}>
             <h3 className="text-sm font-bold uppercase mb-4">{lang.setBudget}</h3>
             <div className="flex gap-2">
               <input type="number" value={input} onChange={e=>setInput(e.target.value)} placeholder="0.00" className="flex-1 bg-black/10 border border-white/10 rounded-xl px-4 py-3 focus:outline-none bg-transparent" />
               <button onClick={()=>{tf('click',settings); if(input) { setExtra({...extra, budget: Number(input)}); setInput(''); }}} className={`px-6 py-3 rounded-xl font-bold text-white shadow-lg ${pbg}`}>Set</button>
             </div>
           </div>
        </div>
      );
    }

    function SavingsPage({ lang, extra, setExtra, settings, glassClass, textMuted, pc, pbg, tf }) {
      const [input, setInput] = useState('');
      const [targetInput, setTargetInput] = useState('');
      const percentage = extra.target > 0 ? Math.min(100, (extra.savings / extra.target) * 100) : 0;

      return (
        <div className={`space-y-6 pb-20 ${settings.animations ? 'animate-fade-in-up' : ''}`}>

              <i className={`fas fa-piggy-bank text-5xl mb-4 text-emerald-500`}></i>
              <h3 className={`text-sm ${textMuted} mb-1`}>{lang.savingsGoal}</h3>
              <h2 className="text-4xl font-bold text-emerald-500">{settings.currency}{extra.savings.toLocaleString()}</h2>

              <div className="mt-6 relative w-full h-4 bg-black/20 rounded-full overflow-hidden border border-white/10">
                <div className="absolute top-0 left-0 h-full bg-emerald-500 transition-all duration-1000" style={{width: `${percentage}%`}}></div>
              </div>
              <p className="text-xs font-bold mt-2 opacity-70">{percentage.toFixed(1)}% Completed</p>

           <div className={`p-4 rounded-2xl ${glassClass} space-y-4`}>
             <div>
               <h3 className="text-xs font-bold uppercase mb-2 opacity-70">{lang.addSavings}</h3>
               <div className="flex gap-2">
                 <input type="number" value={input} onChange={e=>setInput(e.target.value)} placeholder="0.00" className="flex-1 bg-black/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none bg-transparent" />
                 <button onClick={()=>{tf('success',settings); if(input) { setExtra({...extra, savings: extra.savings + Number(input)}); setInput(''); }}} className="px-6 py-2 rounded-xl font-bold text-white bg-emerald-500"><i className="fas fa-plus"></i></button>
               </div>
             </div>
             <div className="border-t border-white/5 pt-4">
               <h3 className="text-xs font-bold uppercase mb-2 opacity-70">Set {lang.target}</h3>
               <div className="flex gap-2">
                 <input type="number" value={targetInput} onChange={(e) => setTargetInput(e.target.value)} placeholder="0.00" className="flex-1 bg-black/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none bg-transparent" />
                 <button onClick={()=>{tf('click',settings); if(targetInput) { setExtra({...extra, target: Number(targetInput)}); setTargetInput(''); }}} className={`px-6 py-2 rounded-xl font-bold text-white ${pbg}`}>Set</button>
               </div>
             </div>
           </div>

      );

    function CalendarPage({ lang, transactions, settings, glassClass, textMuted, pc }) {
      const grouped = useMemo(() => {
        const groups = {};
        transactions.forEach(tx => {
          const d = new Date(tx.date).toLocaleDateString();
          if(!groups[d]) groups[d] = [];
          groups[d].push(tx);
        });
        return groups;
      }, [transactions]);

      return (
        <div className={`space-y-6 pb-20 ${settings.animations ? 'animate-fade-in-up' : ''}`}>
           {Object.keys(grouped).length === 0 ? (
              <div className="text-center opacity-50 pt-10"><i className="fas fa-calendar-xmark text-4xl mb-3"></i><p>{lang.noRecords}</p></div>
           ) : (
              Object.entries(grouped).map(([date, txs]) => (
                <div key={date} className={`p-4 rounded-2xl ${glassClass}`}>
                   <h3 className={`text-sm font-bold mb-3 ${pc} flex items-center gap-2`}><i className="fas fa-calendar-day"></i> {date}</h3>
                   <div className="space-y-3">
                     {txs.map(tx => (
                        <div key={tx.id} className="flex justify-between items-center bg-black/10 p-3 rounded-xl">
                          <div className="flex items-center gap-3">
                            <i className={`fas ${tx.type==='income'?'fa-arrow-down text-emerald-500':'fa-arrow-up text-rose-500'}`}></i>
                            <span className="text-sm font-medium">{tx.description || tx.category}</span>
                          </div>
                          <span className={`font-bold ${tx.type==='income'?'text-emerald-500':'text-rose-500'}`}>{tx.type==='income'?'+':'-'}{settings.currency}{tx.amount}</span>
                        </div>
                     ))}
                   </div>
                </div>
              ))
           )}
        </div>
      );
    }

    function CalculatorPage({ lang, settings, glassClass, textMuted, tf }) {
      const [calc, setCalc] = useState('');
      const [result, setResult] = useState('0');

      const handleCalc = (val) => {
        tf('click', settings);
        if (val === 'C') { setCalc(''); setResult('0'); }
        else if (val === '=') {
          try { const res = eval(calc); setResult(res.toString()); } 
          catch(e) { setResult('Error'); }
        } else { setCalc(calc + val); }
      };

      const btns = ['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'];

      return (
        <div className={`flex flex-col h-[70vh] pb-10 ${settings.animations ? 'animate-fade-in-up' : ''}`}>
           <div className={`flex-1 p-6 rounded-3xl ${glassClass} flex flex-col justify-end items-end mb-6`}>

    function ReportsPage({ lang, transactions, settings, glassClass, textMuted, pc }) {
      const stats = useMemo(() => {
        let expense = 0; let income = 0; let maxExp = 0; let maxInc = 0;
        const catMap = {};
        transactions.forEach(t => { 
          const amt = Number(t.amount);
          if (t.type === 'expense') { expense += amt; if(amt>maxExp) maxExp=amt; catMap[t.category] = (catMap[t.category] || 0) + amt; }
          else { income += amt; if(amt>maxInc) maxInc=amt; }
        });
        const highestCat = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
        const health = income === 0 ? 0 : Math.max(0, Math.round(((income - expense) / income) * 100));
        const days = transactions.length > 0 ? Math.max(1, Math.floor((new Date() - new Date(transactions[transactions.length-1].date)) / (1000*60*60*24))) : 1;
        return { expense, maxExp, maxInc, topCats: highestCat.slice(0,5), health, avgDaily: (expense/days).toFixed(0) };
      }, [transactions]);

      return (
        <div className={`space-y-4 pb-20 ${settings.animations ? 'animate-fade-in-up' : ''}`}>
          <div className={`p-5 rounded-3xl ${glassClass} text-center`}>
             <i className={`fas fa-robot text-4xl mb-2 ${pc}`}></i>
             <h2 className="text-xl font-bold">{lang.aiTitle}</h2>
          </div>
          
          <div className="grid grid-cols-2 gap-4">
             <div className={`p-4 rounded-2xl ${glassClass}`}>
               <p className={`text-[10px] uppercase font-bold ${textMuted} mb-1`}>{lang.health}</p>
               <div className="flex items-end gap-1"><p className={`font-bold text-3xl ${stats.health > 50 ? 'text-emerald-500' : 'text-rose-500'}`}>{stats.health}</p><span className="text-sm pb-1 opacity-50">/100</span></div>
             </div>
             <div className={`p-4 rounded-2xl ${glassClass}`}>
               <p className={`text-[10px] uppercase font-bold ${textMuted} mb-1`}>{lang.avgDaily}</p>
               <p className="font-bold text-xl">{settings.currency}{stats.avgDaily}</p>
             </div>
             <div className={`p-4 rounded-2xl ${glassClass}`}>
               <p className={`text-[10px] uppercase font-bold ${textMuted} mb-1`}>{lang.biggestExp}</p>
               <p className="font-bold text-xl text-rose-500">{settings.currency}{stats.maxExp}</p>
             </div>
             <div className={`p-4 rounded-2xl ${glassClass}`}>
               <p className={`text-[10px] uppercase font-bold ${textMuted} mb-1`}>{lang.biggestInc}</p>
               <p className="font-bold text-xl text-emerald-500">{settings.currency}{stats.maxInc}</p>
             </div>
          </div>

          <div className={`p-4 rounded-2xl ${glassClass}`}>
            <h3 className="text-sm font-bold uppercase mb-3 flex items-center gap-2"><i className="fas fa-fire text-amber-500"></i> {lang.whereSpend}</h3>
            {stats.topCats.map((cat, i) => (
              <div key={cat[0]} className="mb-3 last:mb-0">
                <div className="flex justify-between text-sm mb-1"><span className="font-medium">{cat[0]}</span><span>{settings.currency}{cat[1]}</span></div>
                <div className="w-full bg-black/20 rounded-full h-2"><div className={`bg-${['rose','amber','indigo','emerald','purple'][i%5]}-500 h-2 rounded-full`} style={{width: `${Math.min(100, (cat[1]/stats.expense)*100)}%`}}></div></div>
              </div>
            ))}
          </div>

          <div className={`p-4 rounded-2xl ${glassClass} border border-emerald-500/30 bg-emerald-500/5`}>
             <h3 className="text-sm font-bold flex items-center gap-2 mb-2"><i className="fas fa-lightbulb text-emerald-500"></i> {lang.aiTip}</h3>
             <p className="text-xs leading-relaxed opacity-80">Highest spending is on ({stats.topCats[0]?.[0] || 'N/A'}). Consider controlling this category to boost your score.</p>
          </div>
        </div>
      );
    }

    function TransactionsPage({ lang, transactions, settings, glassClass, textMuted }) {
      const [viewMode, setViewMode] = useState('grouped'); 
      const [expandedGroups, setExpandedGroups] = useState({});

      const groupedTransactions = useMemo(() => {
        const groups = {};
        transactions.forEach(tx => {
          const rawName = (tx.description || tx.category || '').trim();
          const name = rawName === '' ? tx.category : rawName;
          const groupKey = `${tx.type}_${name.toLowerCase()}`;
          
          if (!groups[groupKey]) {
            groups[groupKey] = {
              key: groupKey,
              displayName: name,
              category: tx.category,
              type: tx.type,
              total: 0,
              items: []
            };
          }
          groups[groupKey].total += Number(tx.amount);
          groups[groupKey].items.push(tx);
        });
        return Object.values(groups);
      }, [transactions]);

      const toggleGroup = (key) => {
        setExpandedGroups(prev => ({ ...prev, [key]: !prev[key] }));
      };

      return (
        <div className={`space-y-4 pb-20 ${settings.animations ? 'animate-fade-in-up' : ''}`}>
          <div className="flex justify-end mb-2">
            <div className={`flex p-1 rounded-xl ${glassClass} text-xs font-bold`}>
              <button onClick={() => setViewMode('grouped')} className={`px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 ${viewMode === 'grouped' ? 'bg-indigo-500 text-white' : 'opacity-60'}`}>
                <i className="fas fa-folder-open"></i> {lang.folderView}
              </button>
              <button onClick={() => setViewMode('individual')} className={`px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 ${viewMode === 'individual' ? 'bg-indigo-500 text-white' : 'opacity-60'}`}>
                <i className="fas fa-list"></i> {lang.allTx}
              </button>
            </div>
          </div>

          {viewMode === 'grouped' ? (
            <div className="space-y-3">
              {groupedTransactions.map(group => {
                const isExpanded = expandedGroups[group.key];
                return (
                  <div key={group.key} className={`rounded-2xl ${glassClass} overflow-hidden transition-all duration-300`}>
                    <div onClick={() => toggleGroup(group.key)} className="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5 active:bg-white/10 transition-colors">
                      <div className="flex items-center gap-4">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${group.type === 'income' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'}`}>
                          <i className={`fas ${isExpanded ? 'fa-folder-open' : 'fa-folder'}`}></i>
                        </div>
                        <div>
                          <p className="font-bold text-sm flex items-center gap-2">
                            {group.displayName}
                            <span className="text-[10px] bg-white/10 px-2 py-0.5 rounded-full font-normal opacity-70">
                              {group.items.length} {lang.lang === 'bn' ? 'বার' : 'times'}
                            </span>
                          </p>
                          <p className={`text-[10px] ${textMuted}`}>{group.category}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                        <p className={`font-bold ${group.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}`}>
                          {group.type === 'income' ? '+' : '-'}{settings.currency}{group.total.toLocaleString()}
                        </p>
                        <i className={`fas fa-chevron-down text-xs transition-transform duration-300 opacity-50 ${isExpanded ? 'rotate-180' : ''}`}></i>
                      </div>
                    </div>

                    {isExpanded && (
                      <div className="bg-black/10 border-t border-white/5 divide-y divide-white/5 px-4 py-2 animate-fade-in">
                        {group.items.map(item => (
                          <div key={item.id} className="flex justify-between items-center py-2 text-xs">
                            <span className={`${textMuted}`}>
                              {new Date(item.date).toLocaleDateString(lang.lang === 'bn' ? 'bn-BD' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' })}
                            </span>
                            <span className={`font-semibold ${item.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}`}>
                              {item.type === 'income' ? '+' : '-'}{settings.currency}{item.amount.toLocaleString()}
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
              {groupedTransactions.length === 0 && <p className="text-center opacity-50 mt-10">{lang.noRecords}</p>}
            </div>
          ) : (
            <div className="space-y-3">
              {transactions.map(tx => (
                <div key={tx.id} className={`p-4 rounded-2xl ${glassClass} flex justify-between items-center`}>
                  <div className="flex items-center gap-4">
                    <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tx.type === 'income' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'}`}><i className="fas fa-dollar-sign"></i></div>
                    <div>
                      <p className="font-bold text-sm">{tx.description || tx.category}</p>
                      <p className={`text-[10px] ${textMuted}`}>{tx.category} • {new Date(tx.date).toLocaleDateString()}</p>
                    </div>
                  </div>
                  <p className={`font-bold ${tx.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}`}>{tx.type === 'income' ? '+' : '-'}{settings.currency}{tx.amount}</p>
                </div>
              ))}
              {transactions.length === 0 && <p className="text-center opacity-50 mt-10">{lang.noRecords}</p>}
            </div>
          )}
        </div>
      );
    }

              </div>
              <button type="submit" className={`w-full py-4 mt-4 rounded-xl font-bold text-lg text-white shadow-lg active:scale-95 transition-transform ${pbg}`}>{lang.save}</button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- অফলাইনে সম্পূর্ণ অ্যাপ (CSS/JS assets) লোড করার জন্য সার্ভিস ওয়ার্কার রেজিস্ট্রেশন -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered successfully!', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
