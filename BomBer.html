<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>⚡ স্মুথ বোম্বার | RANA HACKERS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e, #0c1222);
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s;
        }

        body.light {
            background: #eef2f9;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: rgba(20, 22, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.6rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light .container {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.2rem;
        }

        .field {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        input, select, button {
            width: 100%;
            padding: 12px 14px;
            border-radius: 1rem;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9rem;
        }

        body.light input, body.light select {
            background: #f0f2f5;
            color: #111;
            border: 1px solid #ccc;
        }

        button {
            background: #ff416c;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .row > * {
            flex: 1;
            min-width: 110px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 16px;
            border-radius: 2rem;
            margin: 1rem 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2d2d44;
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.2s;
        }

        .log-box {
            background: #0b0b15;
            border-radius: 1.2rem;
            padding: 12px;
            height: 210px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            margin-top: 1rem;
        }

        body.light .log-box {
            background: #f9f9ff;
            border: 1px solid #ddd;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #222;
            word-break: break-word;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 1rem;
            opacity: 0.6;
        }

        .theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #222;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 999;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            .container {
                padding: 1rem;
            }
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="theme-toggle" id="themeToggle">🌙 ডার্ক</div>

    <h1>💥 স্মুথ বোম্বার 💥</h1>

    <div class="field">
        <label>📞 টার্গেট নম্বর (01XXXXXXXXX)</label>

    </div>

    <div class="row">
        <div>
            <label>🔢 মোট এসএমএস</label>
            <input type="number" id="amount" value="50" min="1" max="200">
        </div>
        <div>
            <label>⚡ সমান্তরাল থ্রেড</label>
            <select id="concurrency">
                <option>1</option>
                <option selected>2</option>
                <option>3</option>
                <option>4</option>
            </select>
        </div>
        <div>
            <label>⏱️ বিলম্ব (মিন-ম্যাক্স ms)</label>
            <input type="text" id="delay" value="250-600">
        </div>
        <div>
            <label>🔄 পুনশ্চেষ্টা</label>
            <select id="retries">
                <option>0</option>
                <option selected>1</option>
                <option>2</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div>
            <label>🔊 সাউন্ড</label>
            <select id="sound">
                <option value="on">চালু</option>
                <option value="off">বন্ধ</option>
            </select>
        </div>
        <div>
            <label>&nbsp;</label>
            <button id="startBtn">🚀 শুরু করুন</button>
        </div>
        <div>
            <label>&nbsp;</label>
            <button id="stopBtn" disabled>⏹️ থামান</button>
        </div>
    </div>

    <div class="stats">
        <span>✅ সফল: <strong id="successCount">0</strong></span>
        <span>❌ ব্যর্থ: <strong id="failCount">0</strong></span>
        <span>📊 অগ্রগতি: <strong id="processedCount">0</strong>/<strong id="totalCount">0</strong></span>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="log-box" id="logBox">
        <div class="log-entry">🟢 সিস্টেম প্রস্তুত। নম্বর ও পরিমাণ দিন।</div>
    </div>

</div>

    // ---------- গ্লোবাল স্টেট ----------
    let running = false, stopFlag = false, activeWorkers = 0;
    let success = 0, fail = 0, processed = 0, totalJobs = 0;
    let currentQueue = [];

    function addLog(msg, type = 'info') {
        const logDiv = document.createElement('div');
        logDiv.className = 'log-entry';
        if (type === 'success') logDiv.style.color = '#2ecc71';
        else if (type === 'error') logDiv.style.color = '#e74c3c';
        else logDiv.style.color = '#3b82f6';
        logDiv.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        document.getElementById('logBox').appendChild(logDiv);
        logDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        if (document.getElementById('sound').value === 'on') {
            try {
                let ctx = new (AudioContext || webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = type === 'success' ? 880 : 440;
                gain.gain.value = 0.08;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) { }
        }
    }

    function updateUI() {
        document.getElementById('successCount').innerText = success;
        document.getElementById('failCount').innerText = fail;
        document.getElementById('processedCount').innerText = processed;
        document.getElementById('totalCount').innerText = totalJobs;
        let percent = totalJobs ? (processed / totalJobs) * 100 : 0;
        document.getElementById('progressFill').style.width = percent + '%';
    }

    async function callWithRetry(apiFunc, phone, retriesLeft) {
        for (let i = 0; i <= retriesLeft; i++) {
            try {
                await apiFunc(phone);
                return true;
            } catch (e) {
                if (i === retriesLeft) throw e;
                await new Promise(r => setTimeout(r, 400));
            }
        }
        return false;
    }

    async function worker(phone, retries, minDelay, maxDelay) {
        while (running && !stopFlag && currentQueue.length > 0) {
            const task = currentQueue.shift();
            const delay = Math.floor(Math.random() * (maxDelay - minDelay + 1) + minDelay);
            await new Promise(r => setTimeout(r, delay));
            try {
                await callWithRetry(task.func, phone, retries);
                success++;
                addLog(`✅ ${task.name} সফল`, 'success');
            } catch (err) {
                fail++;
                addLog(`❌ ${task.name} ব্যর্থ`, 'error');
            }
            processed++;
            updateUI();
        }
        activeWorkers--;
        if (activeWorkers === 0 && running) {
            running = false;
            stopFlag = false;
            addLog(`🏁 সম্পন্ন! সফল: ${success}, ব্যর্থ: ${fail}`, 'info');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    }

    async function startBombing() {
        if (running) {
            addLog("ইতিমধ্যে প্রক্রিয়া চলছে!", 'error');
            return;
        }
        const phone = document.getElementById('phone').value.trim();
        if (!phone.match(/^01\d{9}$/)) {
            addLog("❌ সঠিক নম্বর দিন (01XXXXXXXXX)", 'error');
            return;
        }
        let amount = parseInt(document.getElementById('amount').value);
        const concurrency = parseInt(document.getElementById('concurrency').value);
        const retries = parseInt(document.getElementById('retries').value);
        const delayParts = document.getElementById('delay').value.split('-').map(Number);
        const minDelay = delayParts[0] || 200, maxDelay = delayParts[1] || 600;

        // কিউ তৈরি: প্রতিটি API তার limit অনুসারে
        let queue = [];
        for (let api of apis) {
            for (let i = 0; i < api.limit; i++) {
                queue.push({ name: api.name, func: api.func });
            }
        }
        // শাফল (র্যান্ডম ক্রম)
        for (let i = queue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [queue[i], queue[j]] = [queue[j], queue[i]];
        }
        totalJobs = Math.min(amount, queue.length);
        if (amount > queue.length) {
            addLog(`⚠️ সর্বোচ্চ ${queue.length} বার SMS পাঠানো সম্ভব। আপনার দেওয়া ${amount} থেকে ${totalJobs} বার হবে।`, 'info');
        }
        currentQueue = queue.slice(0, totalJobs);
        success = 0; fail = 0; processed = 0; stopFlag = false; running = true;
        updateUI();
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;

        activeWorkers = Math.min(concurrency, currentQueue.length);
        for (let i = 0; i < activeWorkers; i++) {
            worker(phone, retries, minDelay, maxDelay);
        }
    }

    function stopBombing() {
        if (!running) return;
        stopFlag = true;
        running = false;
        addLog("⛔ থামানোর নির্দেশ দেওয়া হয়েছে।", 'error');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
    }

    // থিম টগল
    let darkMode = true;
    document.getElementById('themeToggle').onclick = () => {
        darkMode = !darkMode;
        document.body.classList.toggle('light', !darkMode);
        document.getElementById('themeToggle').innerText = darkMode ? '🌙 ডার্ক' : '☀️ লাইট';
    };

    document.getElementById('startBtn').onclick = startBombing;
    document.getElementById('stopBtn').onclick = stopBombing;

    // মোট কল ক্ষমতা দেখানো
    const totalCapacity = apis.reduce((sum, api) => sum + api.limit, 0);
    addLog(`✅ লোড সম্পন্ন: সর্বমোট ${totalCapacity} বার কল সম্ভব।`, 'success');
</script>
</body>
</html>
